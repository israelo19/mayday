<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="The cardiac arrest script in six steps, each with its spoken line and what you say to move on: check the scene, check breathing, call 911, get in position, push to the beat, hand off. A side branch holds if the person is breathing.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e8eaed; }
    .h { font-size: 30px; font-weight: 700; }
    .sub { font-size: 16px; fill: #9aa3b2; }
    .num { font-size: 13px; font-weight: 800; fill: #0b0d10; }
    .t { font-size: 17px; font-weight: 700; }
    .q { font-size: 13px; fill: #fbbf24; }
    .k { font-size: 11px; font-weight: 700; fill: #6b7280; letter-spacing: 1px; }
    .v { font-size: 14px; font-weight: 700; fill: #34d399; }
    .vb { font-size: 14px; font-weight: 700; fill: #60a5fa; }
    .chip { font-size: 12px; font-weight: 700; fill: #0b0d10; }
    .b { font-size: 13px; fill: #c7cdd6; }
    .foot { font-size: 14px; fill: #9aa3b2; }
  </style>
  <rect width="1200" height="560" rx="18" fill="#0b0d10"/>

  <text class="h" x="48" y="56">The cardiac arrest script</text>
  <text class="sub" x="48" y="84">One of four script files. Every line is from the American Heart Association's hands-only CPR guidance, shortened here to fit.</text>

  <!-- 1 check the scene -->
  <rect x="48" y="112" width="172" height="300" rx="14" fill="#171a21" stroke="#2a2f3a"/>
  <circle cx="70" cy="134" r="11" fill="#ff3b30"/><text class="num" x="70" y="139" text-anchor="middle">1</text>
  <text class="t" x="64" y="172">Check the scene</text>
  <text class="q" x="64" y="200">"Make sure it's safe</text>
  <text class="q" x="64" y="218">to approach.</text>
  <text class="q" x="64" y="236">Tap his shoulders and</text>
  <text class="q" x="64" y="254">shout: are you okay?"</text>
  <line x1="64" y1="330" x2="204" y2="330" stroke="#2a2f3a"/>
  <text class="k" x="64" y="354">YOU SAY</text>
  <text class="v" x="64" y="376">"no response"</text>

  <line x1="222" y1="262" x2="234" y2="262" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 check breathing -->
  <rect x="234" y="112" width="172" height="300" rx="14" fill="#171a21" stroke="#2a2f3a"/>
  <circle cx="256" cy="134" r="11" fill="#ff3b30"/><text class="num" x="256" y="139" text-anchor="middle">2</text>
  <text class="t" x="250" y="172">Check breathing</text>
  <text class="q" x="250" y="200">"Look at his chest.</text>
  <text class="q" x="250" y="218">Is he breathing</text>
  <text class="q" x="250" y="236">normally? Gasping</text>
  <text class="q" x="250" y="254">does not count</text>
  <text class="q" x="250" y="272">as breathing."</text>
  <line x1="250" y1="330" x2="390" y2="330" stroke="#2a2f3a"/>
  <text class="k" x="250" y="354">YOU SAY</text>
  <text class="v" x="250" y="376">"not breathing"</text>

  <line x1="408" y1="262" x2="420" y2="262" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 call 911 -->
  <rect x="420" y="112" width="172" height="300" rx="14" fill="#171a21" stroke="#2a2f3a"/>
  <circle cx="442" cy="134" r="11" fill="#ff3b30"/><text class="num" x="442" y="139" text-anchor="middle">3</text>
  <text class="t" x="436" y="172">Call 911</text>
  <text class="q" x="436" y="200">"Call 911 right now.</text>
  <text class="q" x="436" y="218">Put the phone on</text>
  <text class="q" x="436" y="236">speaker and lay it</text>
  <text class="q" x="436" y="254">on the ground</text>
  <text class="q" x="436" y="272">beside him."</text>
  <line x1="436" y1="330" x2="576" y2="330" stroke="#2a2f3a"/>
  <text class="k" x="436" y="354">THEN</text>
  <text class="vb" x="436" y="376">after 8 seconds</text>

  <line x1="594" y1="262" x2="606" y2="262" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 get in position -->
  <rect x="606" y="112" width="172" height="300" rx="14" fill="#171a21" stroke="#2a2f3a"/>
  <circle cx="628" cy="134" r="11" fill="#ff3b30"/><text class="num" x="628" y="139" text-anchor="middle">4</text>
  <text class="t" x="622" y="172">Get in position</text>
  <text class="q" x="622" y="200">"Kneel beside his chest.</text>
  <text class="q" x="622" y="218">Heel of one hand on</text>
  <text class="q" x="622" y="236">the center of his chest.</text>
  <text class="q" x="622" y="254">Other hand on top.</text>
  <text class="q" x="622" y="272">Lock your elbows."</text>
  <line x1="622" y1="330" x2="762" y2="330" stroke="#2a2f3a"/>
  <text class="k" x="622" y="354">THE CAMERA SEES</text>
  <text class="v" x="622" y="376">pushes start</text>

  <line x1="780" y1="262" x2="792" y2="262" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5 push to the beat -->
  <rect x="792" y="112" width="172" height="300" rx="14" fill="#171a21" stroke="#ff3b30"/>
  <circle cx="814" cy="134" r="11" fill="#ff3b30"/><text class="num" x="814" y="139" text-anchor="middle">5</text>
  <text class="t" x="808" y="172">Push to the beat</text>
  <text class="q" x="808" y="200">"Push hard and fast,</text>
  <text class="q" x="808" y="218">at least two inches</text>
  <text class="q" x="808" y="236">deep. Follow my beat.</text>
  <text class="q" x="808" y="254">Do not stop."</text>
  <rect x="808" y="278" width="92" height="22" rx="11" fill="#34d399"/>
  <text class="chip" x="854" y="293" text-anchor="middle">110 a minute</text>
  <text class="b" x="808" y="320">corrected live from</text>
  <text class="b" x="808" y="336">the camera</text>
  <text class="k" x="808" y="358">YOU SAY</text>
  <text class="v" x="808" y="380">"ambulance here"</text>

  <line x1="966" y1="262" x2="978" y2="262" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6 hand off -->
  <rect x="978" y="112" width="172" height="300" rx="14" fill="#171a21" stroke="#2a2f3a"/>
  <circle cx="1000" cy="134" r="11" fill="#ff3b30"/><text class="num" x="1000" y="139" text-anchor="middle">6</text>
  <text class="t" x="994" y="172">Hand off</text>
  <text class="q" x="994" y="200">"Tell the paramedics:</text>
  <text class="q" x="994" y="218">I'll show you the</text>
  <text class="q" x="994" y="236">timeline on my</text>
  <text class="q" x="994" y="254">screen."</text>
  <line x1="994" y1="330" x2="1134" y2="330" stroke="#2a2f3a"/>
  <text class="k" x="994" y="354">THEN</text>
  <text class="vb" x="994" y="376">the timeline and a QR</text>

  <!-- the breathing branch -->
  <line x1="320" y1="414" x2="320" y2="438" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowblue)"/>
  <rect x="234" y="440" width="358" height="76" rx="12" fill="#0f1a2c" stroke="#60a5fa" stroke-dasharray="6 5"/>
  <text class="vb" x="250" y="464">If he is breathing: "Stay with him. Keep watching</text>
  <text class="vb" x="250" y="482">his chest. If he stops breathing, tell me right away."</text>
  <text class="b" x="250" y="504">"not breathing" goes straight back to Call 911.</text>
  <polyline points="592,478 640,478 640,414" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowblue)"/>

  <text class="foot" x="48" y="548">NEXT always moves on, and every "you say" is also a button. The bleeding and choking scripts have the same shape.</text>
</svg>
