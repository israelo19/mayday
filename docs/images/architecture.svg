<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 716" width="1200" height="716" role="img" aria-label="The Mayday stack. A browser app installed as a PWA. On the device, with no network calls: MediaPipe pose and hand tracking as WebAssembly, signal extraction, a state machine engine running four scripts written as data, a voice queue with a Web Audio metronome and the browser's speech, keyword spotting from the microphone, and an event log that becomes the SITREP, the handoff and a QR. A key proxy on the same origin holds every key. Behind it, Gemini for one photo, xAI Grok for a sentence and a rewording, ElevenLabs for the voices and the live call-taker.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa3b2"/>
    </marker>
    <marker id="arrowblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e8eaed; }
    .h { font-size: 30px; font-weight: 700; }
    .sub { font-size: 16px; fill: #9aa3b2; }
    .band { font-size: 15px; font-weight: 800; letter-spacing: 1px; }
    .bandnote { font-size: 14px; fill: #9aa3b2; }
    .bt { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; fill: #c7cdd6; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #9aa3b2; }
    .stat { font-size: 14px; fill: #e8eaed; }
    .mint { fill: #34d399; } .red { fill: #ff3b30; } .blue { fill: #60a5fa; } .amber { fill: #fbbf24; } .violet { fill: #c084fc; }
  </style>
  <rect width="1200" height="716" rx="18" fill="#0b0d10"/>
  <g transform="translate(0,-72)">

  <!-- browser band -->
  <rect x="48" y="108" width="1104" height="54" rx="12" fill="#171a21" stroke="#2a2f3a"/>
  <text class="band" x="68" y="141">THE APP</text>
  <text class="bandnote" x="170" y="141">Vite, React 19, TypeScript. One page, installed from Chrome or Safari as a PWA. Models and the WASM runtime cache on first load, so it opens with wifi off.</text>

  <!-- on-device region -->
  <rect x="48" y="184" width="1104" height="300" rx="14" fill="#0e1a15" stroke="#34d399" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="band mint" x="68" y="212">ON THE DEVICE</text>
  <text class="bandnote" x="212" y="212">No network calls inside this box. A test scans the code and fails the build if one appears.</text>

  <!-- inputs -->
  <rect x="68" y="236" width="104" height="52" rx="10" fill="#171a21" stroke="#2a2f3a"/>
  <text class="bt" x="120" y="268" text-anchor="middle">Camera</text>
  <rect x="68" y="372" width="104" height="52" rx="10" fill="#171a21" stroke="#2a2f3a"/>
  <text class="bt" x="120" y="404" text-anchor="middle">Microphone</text>

  <!-- mediapipe -->
  <line x1="174" y1="262" x2="196" y2="262" stroke="#9aa3b2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="198" y="230" width="212" height="104" rx="10" fill="#171a21" stroke="#34d399"/>
  <text class="bt mint" x="214" y="254">MediaPipe</text>
  <text class="b" x="214" y="273">Pose + Hand Landmarker as</text>
  <text class="b" x="214" y="289">WebAssembly. 33 body and 21</text>
  <text class="b" x="214" y="305">hand landmarks per frame,</text>
  <text class="b" x="214" y="321">two poses tracked at once.</text>

  <!-- signals -->
  <line x1="412" y1="274" x2="434" y2="274" stroke="#9aa3b2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="436" y="230" width="212" height="104" rx="10" fill="#171a21" stroke="#34d399"/>
  <text class="bt mint" x="452" y="254">Signals</text>
  <text class="b" x="452" y="273">compression rate and recoil,</text>
  <text class="b" x="452" y="289">hands on the wound,</text>
  <text class="b" x="452" y="305">bounding boxes with posture</text>
  <text class="b" x="452" y="321">and stillness, a blind gate</text>

  <!-- recognition -->
  <line x1="174" y1="398" x2="196" y2="398" stroke="#9aa3b2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="198" y="356" width="450" height="84" rx="10" fill="#171a21" stroke="#c084fc"/>
  <text class="bt violet" x="214" y="380">Web Speech recognition, keyword spotting only</text>
  <text class="b" x="214" y="400">The answers the current step accepts, plus phrase cues for how people</text>
  <text class="b" x="214" y="417">talk in a panic. Two layers of echo suppression. Every keyword is a button.</text>

  <!-- engine -->
  <line x1="650" y1="274" x2="672" y2="274" stroke="#9aa3b2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="398" x2="672" y2="398" stroke="#9aa3b2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="674" y="230" width="222" height="210" rx="10" fill="#171a21" stroke="#ff3b30" stroke-width="2"/>
  <text class="bt red" x="690" y="254">State machine engine</text>
  <text class="b" x="690" y="276">279 lines, zero dependencies.</text>
  <text class="b" x="690" y="293">Reads no clock, no network,</text>
  <text class="b" x="690" y="310">no randomness: a test says so.</text>
  <text class="b" x="690" y="336">4 scripts as plain data, every</text>
  <text class="b" x="690" y="353">medical step citing its guideline.</text>
  <text class="b" x="690" y="379">A linter fails the build on a dead</text>
  <text class="b" x="690" y="396">step. A validator checks any</text>
  <text class="b" x="690" y="413">reworded line before it plays.</text>

  <!-- voice out -->
  <line x1="898" y1="262" x2="920" y2="262" stroke="#9aa3b2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="922" y="230" width="210" height="88" rx="10" fill="#171a21" stroke="#60a5fa"/>
  <text class="bt blue" x="938" y="254">Voice queue</text>
  <text class="b" x="938" y="274">Three priorities, preemption,</text>
  <text class="b" x="938" y="291">a Web Audio metronome on the</text>
  <text class="b" x="938" y="308">audio clock, Web Speech out</text>

  <!-- log / handoff -->
  <line x1="898" y1="398" x2="920" y2="398" stroke="#9aa3b2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="922" y="356" width="210" height="84" rx="10" fill="#171a21" stroke="#2a2f3a"/>
  <text class="bt" x="938" y="380">Event log</text>
  <text class="b" x="938" y="400">SITREP and handoff folded from it.</text>
  <text class="b" x="938" y="417">Geolocation, address, a QR code.</text>

  <!-- proxy band -->
  <text class="bandnote" x="618" y="512">one photo, one sentence, only behind a flag</text>
  <line x1="600" y1="486" x2="600" y2="530" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowblue)"/>
  <rect x="48" y="532" width="1104" height="54" rx="12" fill="#0f1a2c" stroke="#60a5fa"/>
  <text class="band blue" x="68" y="565">KEY PROXY</text>
  <text class="bandnote" x="190" y="557">Same origin as the page, so the phone reaches it over its own HTTPS. Holds every key; the browser bundle reads none.</text>
  <text class="mono" x="190" y="577">/vision/assess   /intent/route   /text/complete   /v1/text-to-speech   /dispatcher/session</text>

  <!-- cloud row -->
  <line x1="600" y1="588" x2="600" y2="632" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowblue)"/>
  <rect x="48" y="634" width="356" height="96" rx="12" fill="#0f1a2c" stroke="#60a5fa" stroke-dasharray="8 6"/>
  <text class="bt blue" x="68" y="660">Gemini API, a vision language model</text>
  <text class="mono" x="68" y="680">gemini-3.6-flash, Google AI Studio</text>
  <text class="b" x="68" y="702">One photo in; a closed label and a bounding box out.</text>
  <text class="b" x="68" y="719">Thinking off: classification, not reasoning.</text>

  <rect x="422" y="634" width="356" height="96" rx="12" fill="#0f1a2c" stroke="#60a5fa" stroke-dasharray="8 6"/>
  <text class="bt blue" x="442" y="660">xAI Grok API</text>
  <text class="mono" x="442" y="680">grok-4-1-fast-non-reasoning</text>
  <text class="b" x="442" y="702">A sentence in, the button or answer it meant out.</text>
  <text class="b" x="442" y="719">Rewords one line for the moment, validated first.</text>

  <rect x="796" y="634" width="356" height="96" rx="12" fill="#0f1a2c" stroke="#60a5fa" stroke-dasharray="8 6"/>
  <text class="bt blue" x="816" y="660">ElevenLabs</text>
  <text class="mono" x="816" y="680">eleven_flash_v2_5, ElevenLabs Agents</text>
  <text class="b" x="816" y="702">Coach and call-taker voices, cached at launch.</text>
  <text class="b" x="816" y="719">A live call-taker over WebSocket, PCM16 at 16 kHz.</text>

  <!-- stats -->
  <text class="stat" x="48" y="770"><tspan class="mint" font-weight="700">347</tspan> tests, under a second   <tspan class="mint" font-weight="700">·</tspan>   <tspan class="mint" font-weight="700">4</tspan> scripts, every medical step cited   <tspan class="mint" font-weight="700">·</tspan>   <tspan class="mint" font-weight="700">0</tspan> network calls in the coaching loop   <tspan class="mint" font-weight="700">·</tspan>   every cloud helper off by default, with a local fallback</text>
  </g>
</svg>
